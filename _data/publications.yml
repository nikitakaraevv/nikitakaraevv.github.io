- id: agentic-star
  title: "Agentic STAR: Shape Tracking and Reconstruction from Monocular Videos"
  venue: "2026"
  description: "Shape reconstruction and tracking from video via agentic analysis-by-synthesis: a VLM agent iteratively refines a structured 3D object model, including its geometry and kinematic structure, through a render-and-compare loop with numerical pose optimisation."
  project_page: "https://agenticstar.github.io/"
  pdf: "https://agenticstar.github.io/assets/AgenticSTAR.pdf"
  github: makezur/agenticstar
  image: agenticstar_teaser.mp4
  authors:
    - kmazur
    - nikitakaraev
    - mchang
    - jmalik
    - mshafiullah

- id: vggt-omega
  title: "VGGT-Ω"
  venue: CVPR 2026
  award: Best Paper Finalist
  description: "Feed-forward 3D reconstruction scales predictably with model and data size. VGGT-Ω substantially improves accuracy, efficiency and capabilities for both static and dynamic scenes, trained at unprecedented scale with a dynamic-scene annotation pipeline and self-supervised learning."
  project_page: "https://vggt-omega.github.io/"
  arxiv: 2605.15195
  github: facebookresearch/vggt-omega
  demo: "https://huggingface.co/spaces/facebook/vggt-omega"
  image: vggt_omega_teaser.mp4
  authors:
